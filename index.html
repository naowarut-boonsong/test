<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Durian Smart Farm - ระบบติดตามความชื้นสวนทุเรียน</title>
<!-- ใช้ฟอนต์ Prompt -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root {
    /* โทนสี Neo-Tech Cyberpunk */
    --bg-main: #070a12;        
    --card-bg: rgba(18, 24, 38, 0.85);        
    --card-border: #2a3447;    
    
    --primary: #8b5cf6;        
    --accent: #06b6d4;         
    
    --text-dark: #f3f4f6;      
    --text-muted: #8e9bb0;     
    
    /* สีนีออนไฮไลต์ */
    --color-dry: #ff2a6d;      /* ชมพูนีออน: แห้งไป (<20%) */
    --color-normal: #00f0ff;   /* ไซแอนนีออน: พอดี (20-70%) */
    --color-wet: #a855f7;      /* ม่วงนีออน: แฉะไป (>70%) */
  }

  * { box-sizing: border-box; font-family: 'Prompt', sans-serif; margin: 0; padding: 0; }
  
  body { 
    background-color: var(--bg-main); 
    color: var(--text-dark); 
    padding-bottom: 50px;
    min-height: 100vh;
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 40%);
  }
  
  .container { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
  
  /* --- ส่วนหัว (Header) --- */
  .header {
    display: flex; justify-content: space-between; align-items: center; 
    margin-bottom: 30px; flex-wrap: wrap; gap: 20px;
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    padding: 24px 30px; border-radius: 20px; color: var(--text-dark);
    border: 1px solid var(--card-border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .brand h1 { 
    font-size: 24px; 
    font-weight: 700; 
    display: flex; 
    align-items: center; 
    gap: 12px;
    background: linear-gradient(to right, #00f0ff, #a855f7, #ff2a6d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand p { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
  
  .status-badge {
    background: rgba(7, 10, 18, 0.6); 
    padding: 8px 18px; 
    border-radius: 30px;
    font-size: 13px; 
    font-weight: 500;
    display: flex; 
    align-items: center; 
    gap: 10px; 
    color: #e5e7eb;
    border: 1px solid var(--card-border);
  }
  .dot { 
    width: 8px; 
    height: 8px; 
    background-color: var(--color-normal); 
    border-radius: 50%; 
    box-shadow: 0 0 10px var(--color-normal); 
    animation: blink 1.5s infinite alternate; 
  }
  @keyframes blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }

  /* --- Grid การจัดวาง --- */
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; margin-bottom: 24px; }
  .grid-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
  @media (max-width: 850px) { .grid-layout { grid-template-columns: 1fr; } }

  /* --- การ์ดทั่วไป --- */
  .card {
    background: var(--card-bg); 
    backdrop-filter: blur(12px);
    border-radius: 20px; 
    padding: 26px;
    border: 1px solid var(--card-border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .card-title { 
    font-size: 16px; 
    font-weight: 600; 
    margin-bottom: 20px; 
    color: var(--text-dark); 
    display: flex; 
    align-items: center; 
    gap: 10px; 
    letter-spacing: 0.5px;
  }

  /* --- การ์ดแปลงทุเรียน (Zone Card) --- */
  .zone-card { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    text-align: center; 
    position: relative; 
    border: 1px solid var(--status-color);
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.4), inset 0 0 15px var(--status-glow);
  }
  .zone-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; color: var(--text-dark); }
  
  /* ======================================================================
     ดีไซน์วงกลมสถานะแบบใหม่ (Futuristic Dual-Ring Gauge)
     ====================================================================== */
  .gauge-container { 
    position: relative; 
    width: 170px; 
    height: 170px; 
    margin: 20px 0; 
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  /* วงแหวนรอบนอก (Outer Tech Ring) */
  .gauge-outer-ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 2px dashed rgba(255, 255, 255, 0.12);
    animation: rotateRing 20s linear infinite;
  }
  @keyframes rotateRing { 100% { transform: rotate(360deg); } }

  /* วงกลมหลอดค่าความชื้นหลัก */
  .gauge-circle {
    width: 145px; 
    height: 145px; 
    border-radius: 50%;
    background: conic-gradient(var(--status-color) var(--percent), rgba(255, 255, 255, 0.05) 0deg);
    display: flex; 
    align-items: center; 
    justify-content: center;
    box-shadow: 0 0 20px var(--status-glow);
    transition: background 0.6s ease;
    padding: 10px;
    position: relative;
  }

  /* เข็ม/จุดบอกตำแหน่งตรงกลางวงแหวน */
  .gauge-circle::before {
    content: '';
    position: absolute;
    top: 3px;
    width: 6px;
    height: 6px;
    background: var(--status-color);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--status-color);
  }

  .gauge-inner {
    width: 100%; 
    height: 100%; 
    background: #090d16; 
    border-radius: 50%;
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
  }
  .gauge-value { 
    font-size: 38px; 
    font-weight: 700; 
    color: #ffffff; 
    line-height: 1; 
    text-shadow: 0 0 12px var(--status-glow); 
  }
  .gauge-unit { 
    font-size: 11px; 
    color: var(--text-muted); 
    margin-top: 6px; 
    text-transform: uppercase; 
    letter-spacing: 1.5px; 
  }
  
  .zone-status { 
    padding: 6px 18px; 
    border-radius: 20px; 
    font-size: 13px; 
    font-weight: 600; 
    margin-bottom: 10px;
    letter-spacing: 0.5px;
    border: 1px solid var(--status-color);
    background: var(--status-bg);
    color: var(--status-color);
    box-shadow: 0 0 10px var(--status-glow);
  }
  .zone-time { font-size: 12px; color: var(--text-muted); }

  /* --- กราฟและ Log --- */
  .chart-container { position: relative; height: 300px; width: 100%; }
  .log-list { list-style: none; overflow-y: auto; max-height: 300px; padding-right: 5px; }
  .log-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 10px; 
    border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
    font-size: 13px;
  }
  .log-item:last-child { border-bottom: none; }
  .log-zone { font-weight: 500; color: var(--text-dark); }
  .log-time { font-size: 12px; color: var(--text-muted); }
  .log-badge { 
    padding: 3px 10px; 
    border-radius: 12px; 
    font-size: 12px; 
    font-weight: 700; 
    color: #070a12; 
  }

  /* Scrollbar สำหรับ Log */
  .log-list::-webkit-scrollbar { width: 4px; }
  .log-list::-webkit-scrollbar-thumb { background: #2a3447; border-radius: 4px; }
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <h1>📡 DURIAN SMART MONITORING</h1>
      <p>ระบบติดตามวัดระดับความชื้นเชิงลึกแบบ Real-Time</p>
    </div>
    <div class="status-badge">
      <div class="dot" id="liveDot"></div>
      <span id="liveLabel">กำลังซิงค์ข้อมูล...</span>
    </div>
  </div>

  <!-- สถานะแต่ละแปลง (Zone Cards) -->
  <div class="grid-2" id="zoneGrid">
    <!-- ข้อมูลจะถูกสร้างที่นี่ด้วย JavaScript -->
  </div>

  <!-- กราฟ และ ประวัติล่าสุด -->
  <div class="grid-layout">
    <!-- กราฟแนวโน้ม -->
    <div class="card">
      <div class="card-title">📈 REAL-TIME TREND CHART (กราฟแนวโน้ม)</div>
      <div class="chart-container">
        <canvas id="trendChart"></canvas>
      </div>
    </div>
    
    <!-- บันทึกล่าสุด -->
    <div class="card">
      <div class="card-title">📋 SYSTEM LOGS (บันทึกล่าสุด)</div>
      <ul class="log-list" id="logList">
        <li class="log-item" style="color:var(--text-muted); justify-content:center;">รอข้อมูล...</li>
      </ul>
    </div>
  </div>
</div>

<script>
/* ======================================================================
   ตั้งค่าการเชื่อมต่อ (API URL จาก Google Apps Script ของคุณ)
   ====================================================================== */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbyTRhyPyhDCzkzf1NazTklnBX6hxYKPZI-qMt5B9tRar2DFTarXAdTxjHYdoANgnwUC/exec", 
  REFRESH_MS: 30000 // เช็กข้อมูลบนเว็บทุกๆ 30 วินาที
};

// การตั้งค่าสีและข้อความ
const STATUS_DEF = {
  dry:    { color: "var(--color-dry)",    glow: "rgba(255, 42, 109, 0.4)", bg: "rgba(255, 42, 109, 0.1)", label: "⚠️ ดินแห้ง (ขาดน้ำ)" },
  normal: { color: "var(--color-normal)", glow: "rgba(0, 240, 255, 0.4)",  bg: "rgba(0, 240, 255, 0.1)",  label: "✅ ความชื้นเหมาะสม" },
  wet:    { color: "var(--color-wet)",    glow: "rgba(168, 85, 247, 0.4)", bg: "rgba(168, 85, 247, 0.1)", label: "🚨 ชื้นสูง (ระวังรากเน่า)" }
};

let chartInstance = null; // เก็บตัวแปรสำหรับกราฟ Chart.js

// ฟังก์ชันจัดรูปแบบเวลา
function formatTime(isoStr) {
  if(!isoStr) return "—";
  const d = new Date(isoStr);
  return d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
}

// 1. เรนเดอร์การ์ดและวงกลมสถานะรูปแบบใหม่
function renderZones(zones) {
  const grid = document.getElementById("zoneGrid");
  
  if(zones.length === 0) {
    grid.innerHTML = `<div class="card"><p style="text-align:center; color:var(--text-muted);">ยังไม่มีข้อมูลแปลง</p></div>`;
    return;
  }

  grid.innerHTML = zones.map(z => {
    const pct = Math.max(0, Math.min(100, z.moisture));
    const s = STATUS_DEF[z.status] || STATUS_DEF.normal;
    
    return `
      <div class="card zone-card" style="--status-color: ${s.color}; --status-glow: ${s.glow}; --status-bg: ${s.bg}; --percent: ${pct}%;">
        <div class="zone-name">โซนแปลงทุเรียน ${z.zone}</div>
        
        <div class="gauge-container">
          <div class="gauge-outer-ring"></div>
          <div class="gauge-circle">
            <div class="gauge-inner">
              <span class="gauge-value">${z.moisture}</span>
              <span class="gauge-unit">% MOISTURE</span>
            </div>
          </div>
        </div>

        <div class="zone-status">
          ${s.label}
        </div>
        <div class="zone-time">SYNC: ${formatTime(z.updatedAt)} น.</div>
      </div>
    `;
  }).join("");
}

// 2. เรนเดอร์ประวัติการบันทึก (Log)
function renderLog(history) {
  const list = document.getElementById("logList");
  const recent = [...history].slice(-15).reverse();
  
  if (recent.length === 0) {
    list.innerHTML = `<li class="log-item" style="color:var(--text-muted); justify-content:center;">ไม่มีประวัติการบันทึก</li>`;
    return;
  }

  list.innerHTML = recent.map(h => {
    let badgeColor = "var(--color-normal)";
    if (h.moisture < 20) badgeColor = "var(--color-dry)";
    else if (h.moisture > 70) badgeColor = "var(--color-wet)";
    
    return `
      <li class="log-item">
        <div>
          <span class="log-time">${formatTime(h.time)} น.</span>
          <span class="log-zone" style="margin-left: 10px;">แปลง ${h.zone}</span>
        </div>
        <span class="log-badge" style="background-color: ${badgeColor};">${h.moisture}%</span>
      </li>
    `;
  }).join("");
}

// 3. วาดกราฟเส้นรูปแบบใหม่ (Stepped & Glowing Line Chart)
function renderChart(history, zones) {
  const ctx = document.getElementById('trendChart').getContext('2d');
  
  const sortedHistory = [...history].sort((a,b) => new Date(a.time) - new Date(b.time));
  const labels = [...new Set(sortedHistory.map(h => formatTime(h.time)))];
  
  const colors = ["#00f0ff", "#ff2a6d", "#a855f7", "#3b82f6", "#facc15"];
  const datasets = zones.map((z, index) => {
    const zoneData = labels.map(label => {
      const record = sortedHistory.find(h => formatTime(h.time) === label && h.zone === z.zone);
      return record ? record.moisture : null;
    });

    const themeColor = colors[index % colors.length];

    // สร้างการไล่ระดับสีพื้นหลังใต้เส้นกราฟ
    const gradient = ctx.createLinearGradient(0, 0, 0, 300);
    gradient.addColorStop(0, themeColor + '33');
    gradient.addColorStop(1, themeColor + '00');

    return {
      label: `แปลง ${z.zone}`,
      data: zoneData,
      borderColor: themeColor,
      backgroundColor: gradient,
      borderWidth: 3,
      
      // ปรับรูปแบบกราฟใหม่ ให้เป็นสเต็ปผสมความโค้ง (Stepped Smooth)
      stepped: false,
      cubicInterpolationMode: 'monotone', // เส้นโค้งแบบนุ่มนวล
      
      // ปรับแต่งจุดแสดงข้อมูลบนกราฟ (Glowing Points)
      pointRadius: 4,
      pointHoverRadius: 8,
      pointBackgroundColor: '#070a12',
      pointBorderColor: themeColor,
      pointBorderWidth: 2,
      pointHoverBackgroundColor: themeColor,
      pointHoverBorderColor: '#ffffff',
      
      fill: true,
      spanGaps: true
    };
  });

  if (chartInstance) {
    chartInstance.data.labels = labels;
    chartInstance.data.datasets = datasets;
    chartInstance.update();
  } else {
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: { labels: labels, datasets: datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: 'index',
          intersect: false,
        },
        plugins: {
          legend: { 
            position: 'bottom',
            labels: { color: '#8e9bb0', font: { family: 'Prompt', size: 12 }, usePointStyle: true, boxWidth: 8 }
          },
          tooltip: {
            backgroundColor: 'rgba(9, 13, 22, 0.9)',
            titleColor: '#ffffff',
            bodyColor: '#8e9bb0',
            borderColor: '#2a3447',
            borderWidth: 1,
            padding: 12,
            displayColors: true
          }
        },
        scales: {
          x: {
            grid: { color: 'rgba(255, 255, 255, 0.05)', strokeDash: [4, 4] },
            ticks: { color: '#8e9bb0', font: { family: 'Prompt' } }
          },
          y: { 
            beginAtZero: true, 
            max: 100,
            grid: { color: 'rgba(255, 255, 255, 0.05)', strokeDash: [4, 4] },
            ticks: { color: '#8e9bb0', font: { family: 'Prompt' } },
            title: { display: true, text: 'ความชื้น (%)', color: '#64748b', font: { family: 'Prompt' } }
          }
        }
      }
    });
  }
}

// ฟังก์ชันหลักสำหรับเรียก API และอัปเดตหน้าจอ
async function fetchLiveData() {
  const statusLabel = document.getElementById("liveLabel");
  const dot = document.getElementById("liveDot");
  
  try {
    const res = await fetch(CONFIG.API_URL + "?action=status", { cache: "no-store" });
    if (!res.ok) throw new Error("bad response");
    const data = await res.json();
    
    if (data.zones && data.zones.length > 0) {
      statusLabel.textContent = "ONLINE (" + new Date().toLocaleTimeString('th-TH') + ")";
      dot.style.backgroundColor = "var(--color-normal)";
      
      renderZones(data.zones);
      renderLog(data.history);
      renderChart(data.history, data.zones);
    }
  } catch (err) {
    console.warn("Error fetching data:", err);
    statusLabel.textContent = "OFFLINE";
    dot.style.backgroundColor = "var(--color-dry)";
  }
}

// เริ่มดึงข้อมูลทันทีที่เปิดเว็บ และตั้งเวลารีเฟรช
fetchLiveData();
setInterval(fetchLiveData, CONFIG.REFRESH_MS);
</script>

</body>
</html>
