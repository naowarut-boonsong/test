<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Durian Smart Farm - ระบบติดตามความชื้นสวนทุเรียน</title>
<!-- ใช้ฟอนต์ Prompt -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root {
    /* โทนสีใหม่ชนิดฉีกแนว: Neo-Tech Cyber Smart Farm (โทนเข้ม + นีออน) */
    --bg-main: #0b0f19;        /* สีหลังเข้มลึกอมน้ำเงิน */
    --card-bg: #111827;        /* สีพื้นหลังการ์ด */
    --card-border: #1f2937;    /* เส้นขอบการ์ด */
    
    --primary: #8b5cf6;        /* สีม่วงนีออน (Cyber Violet) */
    --accent: #06b6d4;         /* สีฟ้าไซแอน (Cyber Cyan) */
    
    --text-dark: #f3f4f6;      /* ข้อความหลัก สีขาวสว่าง */
    --text-muted: #9ca3af;     /* ข้อความรอง สีเทา */
    
    /* สีสถานะความชื้นสไตล์ นีออนไฮไลต์ */
    --color-dry: #ff2a6d;      /* ชมพูนีออนสว่าง: แห้งไป (<20%) */
    --color-normal: #05ffa1;   /* เขียวนีออนฟลูออเรสเซนต์: พอดี (20-70%) */
    --color-wet: #00f0ff;      /* ฟ้าไซแอนนีออน: แฉะไป (>70%) */
  }

  * { box-sizing: border-box; font-family: 'Prompt', sans-serif; margin: 0; padding: 0; }
  
  body { 
    background-color: var(--bg-main); 
    color: var(--text-dark); 
    padding-bottom: 50px;
    min-height: 100vh;
    /* ฉากหลังลายจุด Tech Grid Pattern */
    background-image: radial-gradient(#1f2937 1px, transparent 1px);
    background-size: 24px 24px;
  }
  
  .container { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
  
  /* --- ส่วนหัว (Header) สไตล์ Tech Dashboard --- */
  .header {
    display: flex; justify-content: space-between; align-items: center; 
    margin-bottom: 30px; flex-wrap: wrap; gap: 20px;
    background: linear-gradient(90deg, #131c31 0%, #111827 100%);
    padding: 24px 30px; border-radius: 16px; color: var(--text-dark);
    border: 1px solid rgba(139, 92, 246, 0.3);
    box-shadow: 0 0 25px rgba(139, 92, 246, 0.1);
  }
  .brand h1 { 
    font-size: 24px; 
    font-weight: 700; 
    display: flex; 
    align-items: center; 
    gap: 12px;
    background: linear-gradient(to right, #00f0ff, #8b5cf6, #ff2a6d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand p { color: var(--text-muted); font-size: 13px; margin-top: 4px; font-weight: 400; }
  
  .status-badge {
    background: rgba(17, 24, 39, 0.8); 
    padding: 8px 18px; 
    border-radius: 8px;
    font-size: 13px; 
    font-weight: 500;
    display: flex; 
    align-items: center; 
    gap: 10px; 
    color: #e5e7eb;
    border: 1px solid var(--card-border);
  }
  .dot { 
    width: 8px; 
    height: 8px; 
    background-color: var(--color-normal); 
    border-radius: 50%; 
    box-shadow: 0 0 10px var(--color-normal); 
    animation: blink 1.5s infinite alternate; 
  }
  @keyframes blink { 0% { opacity: 0.3; } 100% { opacity: 1; } }

  /* --- Grid การจัดวาง --- */
  .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; margin-bottom: 24px; }
  .grid-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
  @media (max-width: 850px) { .grid-layout { grid-template-columns: 1fr; } }

  /* --- การ์ดทั่วไป --- */
  .card {
    background: var(--card-bg); 
    border-radius: 16px; 
    padding: 26px;
    border: 1px solid var(--card-border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .card-title { 
    font-size: 17px; 
    font-weight: 600; 
    margin-bottom: 20px; 
    color: var(--text-dark); 
    display: flex; 
    align-items: center; 
    gap: 10px; 
    letter-spacing: 0.5px;
  }

  /* --- การ์ดแปลงทุเรียน (Zone Card Redesign) --- */
  .zone-card { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    text-align: center; 
    position: relative; 
    border-top: 3px solid var(--status-color);
  }
  .zone-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; color: var(--text-dark); }
  
  /* วงกลม Progress Bar สไตล์ แผงควบคุมไซเบอร์ */
  .gauge-container { position: relative; width: 160px; height: 160px; margin: 20px 0; }
  .gauge-circle {
    width: 100%; height: 100%; border-radius: 50%;
    background: conic-gradient(var(--status-color) var(--percent), #1f2937 0deg);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 15px rgba(0,0,0,0.5), inset 0 0 15px var(--status-color);
    transition: background 0.5s ease;
    padding: 12px;
  }
  .gauge-inner {
    width: 100%; height: 100%; 
    background: #0b0f19; 
    border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1px solid var(--card-border);
  }
  .gauge-value { font-size: 42px; font-weight: 700; color: #ffffff; line-height: 1; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
  .gauge-unit { font-size: 11px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 1px; }
  
  .zone-status { 
    padding: 6px 16px; 
    border-radius: 6px; 
    font-size: 13px; 
    font-weight: 600; 
    margin-bottom: 10px;
    letter-spacing: 0.5px;
    border: 1px solid var(--status-color);
  }
  .zone-time { font-size: 12px; color: var(--text-muted); }

  /* --- กราฟและ Log --- */
  .chart-container { position: relative; height: 300px; width: 100%; }
  .log-list { list-style: none; overflow-y: auto; max-height: 300px; padding-right: 5px; }
  .log-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 10px; 
    border-bottom: 1px solid var(--card-border); 
    font-size: 13px;
  }
  .log-item:last-child { border-bottom: none; }
  .log-zone { font-weight: 500; color: var(--text-dark); }
  .log-time { font-size: 12px; color: var(--text-muted); }
  .log-badge { 
    padding: 2px 8px; 
    border-radius: 4px; 
    font-size: 12px; 
    font-weight: 700; 
    color: #000000; 
  }

  /* Scrollbar สำหรับ Log */
  .log-list::-webkit-scrollbar { width: 4px; }
  .log-list::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <h1>⚡ DURIAN SMART MONITOR</h1>
      <p>ระบบตรวจวัดความชื้นวิเคราะห์เชิงลึกแบบ Real-Time</p>
    </div>
    <div class="status-badge">
      <div class="dot" id="liveDot"></div>
      <span id="liveLabel">กำลังซิงค์ข้อมูล...</span>
    </div>
  </div>

  <!-- สถานะแต่ละแปลง (Zone Cards) -->
  <div class="grid-2" id="zoneGrid">
    <!-- ข้อมูลจะถูกสร้างที่นี่ด้วย JavaScript -->
  </div>

  <!-- กราฟ และ ประวัติล่าสุด -->
  <div class="grid-layout">
    <!-- กราฟแนวโน้ม -->
    <div class="card">
      <div class="card-title">📈 ANALYTICS LOG (กราฟแสดงแนวโน้ม)</div>
      <div class="chart-container">
        <canvas id="trendChart"></canvas>
      </div>
    </div>
    
    <!-- บันทึกล่าสุด -->
    <div class="card">
      <div class="card-title">📋 RECENT DATA (ประวัติ)</div>
      <ul class="log-list" id="logList">
        <li class="log-item" style="color:var(--text-muted); justify-content:center;">รอข้อมูล...</li>
      </ul>
    </div>
  </div>
</div>

<script>
/* ======================================================================
   ตั้งค่าการเชื่อมต่อ (API URL จาก Google Apps Script ของคุณ)
   ====================================================================== */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbyTRhyPyhDCzkzf1NazTklnBX6hxYKPZI-qMt5B9tRar2DFTarXAdTxjHYdoANgnwUC/exec", 
  REFRESH_MS: 30000 // เช็กข้อมูลบนเว็บทุกๆ 30 วินาที
};

// การตั้งค่าสีและข้อความ
const STATUS_DEF = {
  dry:    { color: "var(--color-dry)",    bg: "rgba(255, 42, 109, 0.1)", label: "⚠️ ดินแห้ง (ขาดน้ำ)" },
  normal: { color: "var(--color-normal)", bg: "rgba(5, 255, 161, 0.1)", label: "✅ ความชื้นเหมาะสม" },
  wet:    { color: "var(--color-wet)",    bg: "rgba(0, 240, 255, 0.1)",  label: "🚨 ชื้นสูง (ระวังรากเน่า)" }
};

let chartInstance = null; // เก็บตัวแปรสำหรับกราฟ Chart.js

// ฟังก์ชันจัดรูปแบบเวลา
function formatTime(isoStr) {
  if(!isoStr) return "—";
  const d = new Date(isoStr);
  return d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
}

// 1. เรนเดอร์การ์ดวงกลมด้านบน
function renderZones(zones) {
  const grid = document.getElementById("zoneGrid");
  
  if(zones.length === 0) {
    grid.innerHTML = `<div class="card"><p style="text-align:center; color:var(--text-muted);">ยังไม่มีข้อมูลแปลง</p></div>`;
    return;
  }

  grid.innerHTML = zones.map(z => {
    const pct = Math.max(0, Math.min(100, z.moisture));
    const s = STATUS_DEF[z.status] || STATUS_DEF.normal;
    
    return `
      <div class="card zone-card" style="--status-color: ${s.color}; --percent: ${pct}%;">
        <div class="zone-name">โซนแปลงทุเรียน ${z.zone}</div>
        
        <div class="gauge-container">
          <div class="gauge-circle">
            <div class="gauge-inner">
              <span class="gauge-value">${z.moisture}</span>
              <span class="gauge-unit">% MOISTURE</span>
            </div>
          </div>
        </div>

        <div class="zone-status" style="background-color: ${s.bg}; color: ${s.color};">
          ${s.label}
        </div>
        <div class="zone-time">SYNC: ${formatTime(z.updatedAt)} น.</div>
      </div>
    `;
  }).join("");
}

// 2. เรนเดอร์ประวัติการบันทึก (Log)
function renderLog(history) {
  const list = document.getElementById("logList");
  const recent = [...history].slice(-15).reverse();
  
  if (recent.length === 0) {
    list.innerHTML = `<li class="log-item" style="color:var(--text-muted); justify-content:center;">ไม่มีประวัติการบันทึก</li>`;
    return;
  }

  list.innerHTML = recent.map(h => {
    let badgeColor = "var(--color-normal)";
    if (h.moisture < 20) badgeColor = "var(--color-dry)";
    else if (h.moisture > 70) badgeColor = "var(--color-wet)";
    
    return `
      <li class="log-item">
        <div>
          <span class="log-time">${formatTime(h.time)} น.</span>
          <span class="log-zone" style="margin-left: 10px;">แปลง ${h.zone}</span>
        </div>
        <span class="log-badge" style="background-color: ${badgeColor};">${h.moisture}%</span>
      </li>
    `;
  }).join("");
}

// 3. วาดกราฟเส้นด้วย Chart.js
function renderChart(history, zones) {
  const ctx = document.getElementById('trendChart').getContext('2d');
  
  const sortedHistory = [...history].sort((a,b) => new Date(a.time) - new Date(b.time));
  const labels = [...new Set(sortedHistory.map(h => formatTime(h.time)))];
  
  // โทนสีเส้นกราฟแบบ นีออน
  const colors = ["#00f0ff", "#ff2a6d", "#05ffa1", "#8b5cf6", "#facc15"];
  const datasets = zones.map((z, index) => {
    const zoneData = labels.map(label => {
      const record = sortedHistory.find(h => formatTime(h.time) === label && h.zone === z.zone);
      return record ? record.moisture : null;
    });

    const themeColor = colors[index % colors.length];

    return {
      label: `แปลง ${z.zone}`,
      data: zoneData,
      borderColor: themeColor,
      backgroundColor: themeColor + '10',
      borderWidth: 2,
      pointRadius: 4,
      pointBackgroundColor: themeColor,
      tension: 0.2,
      fill: true,
      spanGaps: true
    };
  });

  if (chartInstance) {
    chartInstance.data.labels = labels;
    chartInstance.data.datasets = datasets;
    chartInstance.update();
  } else {
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: { labels: labels, datasets: datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { 
            position: 'bottom',
            labels: { color: '#9ca3af', font: { family: 'Prompt', size: 12 } }
          }
        },
        scales: {
          x: {
            grid: { color: '#1f2937' },
            ticks: { color: '#9ca3af', font: { family: 'Prompt' } }
          },
          y: { 
            beginAtZero: true, 
            max: 100,
            grid: { color: '#1f2937' },
            ticks: { color: '#9ca3af', font: { family: 'Prompt' } },
            title: { display: true, text: 'ความชื้น (%)', color: '#6b7280', font: { family: 'Prompt' } }
          }
        }
      }
    });
  }
}

// ฟังก์ชันหลักสำหรับเรียก API และอัปเดตหน้าจอ
async function fetchLiveData() {
  const statusLabel = document.getElementById("liveLabel");
  const dot = document.getElementById("liveDot");
  
  try {
    const res = await fetch(CONFIG.API_URL + "?action=status", { cache: "no-store" });
    if (!res.ok) throw new Error("bad response");
    const data = await res.json();
    
    if (data.zones && data.zones.length > 0) {
      statusLabel.textContent = "ONLINE (" + new Date().toLocaleTimeString('th-TH') + ")";
      dot.style.backgroundColor = "var(--color-normal)";
      
      renderZones(data.zones);
      renderLog(data.history);
      renderChart(data.history, data.zones);
    }
  } catch (err) {
    console.warn("Error fetching data:", err);
    statusLabel.textContent = "OFFLINE";
    dot.style.backgroundColor = "var(--color-dry)";
  }
}

// เริ่มดึงข้อมูลทันทีที่เปิดเว็บ และตั้งเวลารีเฟรช
fetchLiveData();
setInterval(fetchLiveData, CONFIG.REFRESH_MS);
</script>

</body>
</html>
