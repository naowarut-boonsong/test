<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Durian Smart Farm - Command Center</title>
<!-- ใช้ฟอนต์ Prompt -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root {
    /* โทนสีใหม่: Deep Cosmic Dark & Cyber Cyan */
    --bg-dark: #030712;
    --panel-bg: rgba(15, 23, 42, 0.75);
    --panel-border: rgba(56, 189, 248, 0.2);
    
    --neon-cyan: #00f0ff;
    --neon-pink: #ff0055;
    --neon-green: #00ff88;
    --neon-purple: #7000ff;

    --text-main: #f8fafc;
    --text-sub: #64748b;
  }

  * { box-sizing: border-box; font-family: 'Prompt', sans-serif; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    min-height: 100vh;
    padding: 24px;
    /* ฉากหลังลายเรขาคณิตยุคอนาคต */
    background-image: 
      linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .wrapper { max-width: 1300px; margin: 0 auto; }

  /* --- Top Navigation / Command Bar --- */
  .command-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    margin-bottom: 24px;
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.05);
  }

  .nav-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--text-main);
  }

  .nav-title span {
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .system-status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    padding: 6px 16px;
    border-radius: 20px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background-color: var(--neon-green);
    box-shadow: 0 0 10px var(--neon-green);
  }

  /* --- Bento Grid Layout รื้อใหม่ทั้งหมด --- */
  .bento-grid {
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    gap: 24px;
  }

  @media (max-width: 992px) {
    .bento-grid { grid-template-columns: 1fr; }
  }

  /* --- Panel สไตล์ Tactical --- */
  .panel {
    background: var(--panel-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .panel-title {
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* --- รูปแบบการวัดผลแนวนอนแบบใหม่ (Segmented Horizontal Bars) --- */
  .zones-container {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .zone-item {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    padding: 16px;
    transition: all 0.3s ease;
  }

  .zone-item:hover {
    border-color: var(--panel-border);
  }

  .zone-info-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .zone-label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
  }

  .tree-badge {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    display: flex; align-items: center; justify-content: center;
  }

  .zone-value-num {
    font-size: 22px;
    font-weight: 700;
    font-family: monospace;
  }

  /* แถบหลอดวัดระดับแบบแนวนอน */
  .bar-wrapper {
    height: 12px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    margin-bottom: 10px;
  }

  .bar-fill {
    height: 100%;
    width: 0%;
    border-radius: 6px;
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 12px currentColor;
  }

  .zone-foot {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-sub);
  }

  .status-tag {
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
  }

  /* --- ฝั่งขวา: กราฟ + ประวัติย่อย --- */
  .right-column {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .chart-box { height: 320px; width: 100%; }

  /* ตารางประวัติสไตล์ Terminal Log */
  .log-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  .log-table th {
    text-align: left;
    color: var(--text-sub);
    padding: 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .log-table td {
    padding: 10px 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.03);
  }

  .log-table tr:hover { background: rgba(255,255,255,0.02); }
</style>
</head>
<body>

<div class="wrapper">
  <!-- Command Bar ด้านบน -->
  <header class="command-bar">
    <div class="nav-title">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--neon-cyan)" stroke-width="2">
        <path d="M12 2v4M12 6L9 3.5M12 6l3-2.5"/>
        <path d="M12 6a6 6 0 0 0-6 6c0 3.31 2.69 6 6 6s6-2.69 6-6a6 6 0 0 0-6-6z"/>
        <path d="M11 18v4h2v-4"/>
      </svg>
      <span>DURIAN TACTICAL HUB</span>
    </div>
    <div class="system-status">
      <div class="status-dot" id="liveDot"></div>
      <span id="liveLabel">CONNECTING...</span>
    </div>
  </header>

  <!-- Bento Grid การจัดวางรูปแบบใหม่ -->
  <div class="bento-grid">
    
    <!-- ฝั่งซ้าย: แสดงสถานะแปลงทุเรียนด้วย Bar แบบใหม่ -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--neon-cyan)"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
          การตรวจวัดความชื้นแปลงทุเรียน
        </div>
      </div>

      <div class="zones-container" id="zoneGrid">
        <!-- ข้อมูลหลอดแนวนอนจะมาโผล่ตรงนี้ -->
      </div>
    </div>

    <!-- ฝั่งขวา: กราฟวิเคราะห์ และ Terminal Logs -->
    <div class="right-column">
      
      <!-- กราฟ -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--neon-purple)"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 17.08z"/></svg>
            แนวโน้มความชื้นย้อนหลัง
          </div>
        </div>
        <div class="chart-box">
          <canvas id="trendChart"></canvas>
        </div>
      </div>

      <!-- Log ประวัติแบบ Terminal Table -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--neon-green)"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            ประวัติการซิงค์ล่าสุด
          </div>
        </div>
        <table class="log-table">
          <thead>
            <tr>
              <th>เวลา</th>
              <th>แปลง</th>
              <th>ความชื้น</th>
              <th>สถานะ</th>
            </tr>
          </thead>
          <tbody id="logList">
            <tr><td colspan="4" style="text-align:center; color:var(--text-sub);">กำลังโหลดประวัติ...</td></tr>
          </tbody>
        </table>
      </div>

    </div>

  </div>
</div>

<script>
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbyTRhyPyhDCzkzf1NazTklnBX6hxYKPZI-qMt5B9tRar2DFTarXAdTxjHYdoANgnwUC/exec", 
  REFRESH_MS: 30000 
};

let chartInstance = null;

function formatTime(isoStr) {
  if(!isoStr) return "—";
  const d = new Date(isoStr);
  return d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
}

// 1. เรนเดอร์หลอดแนวนอนสไตล์ใหม่
function renderZones(zones) {
  const grid = document.getElementById("zoneGrid");
  
  if(!zones || zones.length === 0) {
    grid.innerHTML = `<p style="text-align:center; color:var(--text-sub);">ไม่พบข้อมูลแปลง</p>`;
    return;
  }

  grid.innerHTML = zones.map(z => {
    const pct = Math.max(0, Math.min(100, z.moisture));
    
    // กำหนดสีตามเงื่อนไขความชื้น
    let color = "var(--neon-green)";
    let statusText = "ปกติ";
    let bgTag = "rgba(0, 255, 136, 0.1)";

    if (z.moisture < 20) {
      color = "var(--neon-pink)";
      statusText = "แห้งเกินไป";
      bgTag = "rgba(255, 0, 85, 0.1)";
    } else if (z.moisture > 70) {
      color = "var(--neon-cyan)";
      statusText = "ชื้นสูง";
      bgTag = "rgba(0, 240, 255, 0.1)";
    }

    return `
      <div class="zone-item">
        <div class="zone-info-head">
          <div class="zone-label">
            <div class="tree-badge">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="${color}">
                <path d="M12 2v4M12 6L9 3.5M12 6l3-2.5"/>
                <path d="M12 6a6 6 0 0 0-6 6c0 3.31 2.69 6 6 6s6-2.69 6-6a6 6 0 0 0-6-6z"/>
                <path d="M11 18v4h2v-4"/>
              </svg>
            </div>
            แปลงทุเรียน ${z.zone}
          </div>
          <div class="zone-value-num" style="color: ${color};">${z.moisture}%</div>
        </div>

        <div class="bar-wrapper">
          <div class="bar-fill" style="width: ${pct}%; background-color: ${color};"></div>
        </div>

        <div class="zone-foot">
          <span class="status-tag" style="background: ${bgTag}; color: ${color};">${statusText}</span>
          <span>อัปเดต: ${formatTime(z.updatedAt)} น.</span>
        </div>
      </div>
    `;
  }).join("");
}

// 2. เรนเดอร์ประวัติแบบ Terminal Table
function renderLog(history) {
  const list = document.getElementById("logList");
  const recent = [...history].slice(-6).reverse();
  
  if (recent.length === 0) {
    list.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-sub);">ไม่มีประวัติ</td></tr>`;
    return;
  }

  list.innerHTML = recent.map(h => {
    let color = "var(--neon-green)";
    let label = "ปกติ";
    if (h.moisture < 20) { color = "var(--neon-pink)"; label = "แห้ง"; }
    else if (h.moisture > 70) { color = "var(--neon-cyan)"; label = "ชื้นสูง"; }

    return `
      <tr>
        <td>${formatTime(h.time)} น.</td>
        <td>แปลง ${h.zone}</td>
        <td style="font-weight:700; color:${color};">${h.moisture}%</td>
        <td><span style="color:${color};">${label}</span></td>
      </tr>
    `;
  }).join("");
}

// 3. กราฟแนวโน้ม
function renderChart(history, zones) {
  const ctx = document.getElementById('trendChart').getContext('2d');
  const sortedHistory = [...history].sort((a,b) => new Date(a.time) - new Date(b.time));
  const labels = [...new Set(sortedHistory.map(h => formatTime(h.time)))];
  
  const colors = ["#00f0ff", "#ff0055", "#00ff88", "#7000ff"];
  const datasets = zones.map((z, index) => {
    const zoneData = labels.map(label => {
      const record = sortedHistory.find(h => formatTime(h.time) === label && h.zone === z.zone);
      return record ? record.moisture : null;
    });

    const themeColor = colors[index % colors.length];

    return {
      label: `แปลง ${z.zone}`,
      data: zoneData,
      borderColor: themeColor,
      borderWidth: 2,
      pointRadius: 3,
      pointBackgroundColor: themeColor,
      tension: 0.3,
      spanGaps: true
    };
  });

  if (chartInstance) {
    chartInstance.data.labels = labels;
    chartInstance.data.datasets = datasets;
    chartInstance.update();
  } else {
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: { labels: labels, datasets: datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { labels: { color: '#64748b', font: { family: 'Prompt' } } }
        },
        scales: {
          x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#64748b' } },
          y: { beginAtZero: true, max: 100, grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: '#64748b' } }
        }
      }
    });
  }
}

// ดึงข้อมูล Real-Time
async function fetchLiveData() {
  const statusLabel = document.getElementById("liveLabel");
  const dot = document.getElementById("liveDot");
  
  try {
    const res = await fetch(CONFIG.API_URL + "?action=status", { cache: "no-store" });
    if (!res.ok) throw new Error("bad response");
    const data = await res.json();
    
    if (data.zones && data.zones.length > 0) {
      statusLabel.textContent = "SYSTEM ACTIVE";
      dot.style.backgroundColor = "var(--neon-green)";
      
      renderZones(data.zones);
      renderLog(data.history);
      renderChart(data.history, data.zones);
    }
  } catch (err) {
    statusLabel.textContent = "OFFLINE";
    dot.style.backgroundColor = "var(--neon-pink)";
  }
}

fetchLiveData();
setInterval(fetchLiveData, CONFIG.REFRESH_MS);
</script>

</body>
</html>
